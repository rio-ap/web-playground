name: Detect Changes
description: Detect which modules changed in a PR against the base branch.
inputs:
  base-ref:
    description: Base branch ref (e.g. main)
    required: true

outputs:
  products:
    description: src/products.js or its test changed
    value: ${{ steps.check.outputs.products }}
  cart:
    description: src/cart.js or its test changed
    value: ${{ steps.check.outputs.cart }}
  checkout:
    description: src/checkout.js or its test changed
    value: ${{ steps.check.outputs.checkout }}
  config:
    description: package.json or vitest.config.js changed
    value: ${{ steps.check.outputs.config }}
  e2e:
    description: E2E-relevant changes were detected
    value: ${{ steps.check.outputs.e2e }}
  e2e_tags:
    description: Playwright tags to run (pipe-separated)
    value: ${{ steps.check.outputs.e2e_tags }}

runs:
  using: composite
  steps:
    - shell: bash
      id: check
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        BASE="$BASE_REF"
        CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null || echo "")

        # Per-module unit test triggers
        echo "products=$(echo "$CHANGED" | grep -qE '^src/products\.js$|^tests/unit/products\.test\.ts$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "cart=$(echo "$CHANGED" | grep -qE '^src/cart\.js$|^tests/unit/cart\.test\.ts$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "checkout=$(echo "$CHANGED" | grep -qE '^src/checkout\.js$|^tests/unit/checkout\.test\.ts$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

        # Config triggers (runs everything)
        echo "config=$(echo "$CHANGED" | grep -qE '^package\.json$|^vitest\.config\.js$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

        # E2E selection: map changed paths to module tags
        E2E_TAGS=$(node scripts/detect-e2e-tags.mjs <<< "$CHANGED")
        echo "e2e_tags=${E2E_TAGS}" >> "$GITHUB_OUTPUT"
        echo "e2e=$([ -n "${E2E_TAGS// }" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
