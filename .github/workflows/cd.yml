name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit Test Coverage
        id: coverage
        run: npm run coverage

      - name: Install Playwright
        id: playwright
        run: npx playwright install --with-deps

      - name: E2E Tests
        id: e2e
        run: npx playwright test

      - name: Accessibility Audits
        id: a11y
        run: npm run test:a11y

      - name: Build
        id: build
        run: npm run build

      - name: Copy coverage to dist
        run: mkdir -p dist/coverage && cp -r coverage/* dist/coverage/

      - name: Copy test reports to dist
        run: mkdir -p dist/test-reports && cp -r playwright-report/* dist/test-reports/

      - name: Production Smoke Test
        id: smoke
        run: npm run test:smoke

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Write run summary
        if: always()
        env:
          STEPS_JSON: >-
            [{"label":"Unit coverage","result":"${{ steps.coverage.outcome }}"},
             {"label":"Install Playwright","result":"${{ steps.playwright.outcome }}"},
             {"label":"E2E tests","result":"${{ steps.e2e.outcome }}"},
             {"label":"Accessibility audits","result":"${{ steps.a11y.outcome }}"},
             {"label":"Build","result":"${{ steps.build.outcome }}"},
             {"label":"Smoke test","result":"${{ steps.smoke.outcome }}"}]
        run: printf '%s' "$STEPS_JSON" | node scripts/ci-summary.mjs --steps - --title "CD pipeline results" --commit "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deploy summary
        if: always()
        env:
          OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Deployment"
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ Deployed to $PAGE_URL"
            elif [ "$OUTCOME" = "failure" ]; then
              echo "❌ Deployment failed"
            else
              echo "⏭️ Deployment skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
