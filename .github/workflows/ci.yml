name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.check.outputs.products }}
      cart: ${{ steps.check.outputs.cart }}
      checkout: ${{ steps.check.outputs.checkout }}
      config: ${{ steps.check.outputs.config }}
      e2e: ${{ steps.check.outputs.e2e }}
      e2e_tags: ${{ steps.check.outputs.e2e_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/detect-changes
        id: check
        with:
          base-ref: ${{ github.base_ref }}

  products-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.products == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run tests/unit/products.test.ts --reporter=default --reporter=json --outputFile.json=.ci-status/raw/products-unit.json
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool vitest --id products-unit --report .ci-status/raw/products-unit.json --result "${{ job.status }}" --output .ci-status/tests/products-unit.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-products-unit
          path: .ci-status/tests/
          retention-days: 1

  cart-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.cart == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run tests/unit/cart.test.ts --reporter=default --reporter=json --outputFile.json=.ci-status/raw/cart-unit.json
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool vitest --id cart-unit --report .ci-status/raw/cart-unit.json --result "${{ job.status }}" --output .ci-status/tests/cart-unit.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-cart-unit
          path: .ci-status/tests/
          retention-days: 1

  checkout-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.checkout == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run tests/unit/checkout.test.ts --reporter=default --reporter=json --outputFile.json=.ci-status/raw/checkout-unit.json
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool vitest --id checkout-unit --report .ci-status/raw/checkout-unit.json --result "${{ job.status }}" --output .ci-status/tests/checkout-unit.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-checkout-unit
          path: .ci-status/tests/
          retention-days: 1

  e2e-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --grep "${{ needs.detect-changes.outputs.e2e_tags }}"
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-status/raw/e2e-${{ matrix.browser }}.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool playwright --id e2e-${{ matrix.browser }} --report .ci-status/raw/e2e-${{ matrix.browser }}.json --result "${{ job.status }}" --output .ci-status/tests/e2e-${{ matrix.browser }}.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-e2e-${{ matrix.browser }}
          path: .ci-status/tests/
          retention-days: 1

  smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Production smoke test
        run: npm run test:smoke
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-status/raw/smoke.json
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report-smoke/
          retention-days: 7
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool playwright --id smoke --report .ci-status/raw/smoke.json --result "${{ job.status }}" --output .ci-status/tests/smoke.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-smoke
          path: .ci-status/tests/
          retention-days: 1

  a11y-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run accessibility audits
        run: npx playwright test -c playwright.a11y.config.ts --grep "${{ needs.detect-changes.outputs.e2e_tags }}"
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-status/raw/a11y-tests.json
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report-a11y/
          retention-days: 7
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool playwright --id a11y-tests --report .ci-status/raw/a11y-tests.json --result "${{ job.status }}" --output .ci-status/tests/a11y-tests.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-a11y-tests
          path: .ci-status/tests/
          retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  test-summary:
    needs: [detect-changes, products-unit, cart-unit, checkout-unit, e2e-tests, smoke, a11y-tests, coverage]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download test statuses
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-status-*
          merge-multiple: true
          path: .ci-status/tests
      - name: Build summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -o pipefail
          printf '%s' "$NEEDS_JSON" | node scripts/ci-summary.mjs --needs - --tests-dir .ci-status/tests --commit "${{ github.event.pull_request.head.sha }}" | tee -a "$GITHUB_STEP_SUMMARY" > ci-comment.md
      - name: Post test-status PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- ci-test-summary -->';
            const body = fs.readFileSync('ci-comment.md', 'utf8');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
