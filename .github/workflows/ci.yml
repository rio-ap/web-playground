name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.check.outputs.products }}
      cart: ${{ steps.check.outputs.cart }}
      checkout: ${{ steps.check.outputs.checkout }}
      config: ${{ steps.check.outputs.config }}
      browser: ${{ steps.check.outputs.browser }}
      browser_tags: ${{ steps.check.outputs.browser_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/detect-changes
        id: check
        with:
          base-ref: ${{ github.base_ref }}

  products-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.products == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run tests/unit/products.test.ts --reporter=default --reporter=json --outputFile.json=.ci-status/raw/products-unit.json
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool vitest --id products-unit --report .ci-status/raw/products-unit.json --result "${{ job.status }}" --output .ci-status/tests/products-unit.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-products-unit
          path: .ci-status/tests/
          retention-days: 1

  cart-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.cart == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run tests/unit/cart.test.ts --reporter=default --reporter=json --outputFile.json=.ci-status/raw/cart-unit.json
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool vitest --id cart-unit --report .ci-status/raw/cart-unit.json --result "${{ job.status }}" --output .ci-status/tests/cart-unit.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-cart-unit
          path: .ci-status/tests/
          retention-days: 1

  checkout-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.checkout == 'true' || needs.detect-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run tests/unit/checkout.test.ts --reporter=default --reporter=json --outputFile.json=.ci-status/raw/checkout-unit.json
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool vitest --id checkout-unit --report .ci-status/raw/checkout-unit.json --result "${{ job.status }}" --output .ci-status/tests/checkout-unit.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-checkout-unit
          path: .ci-status/tests/
          retention-days: 1

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    needs: detect-changes
    if: needs.detect-changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --grep "${{ needs.detect-changes.outputs.browser_tags }}"
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-status/raw/browser-${{ matrix.browser }}.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool playwright --id browser-${{ matrix.browser }} --report .ci-status/raw/browser-${{ matrix.browser }}.json --result "${{ job.status }}" --output .ci-status/tests/browser-${{ matrix.browser }}.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-browser-${{ matrix.browser }}
          path: .ci-status/tests/
          retention-days: 1

  e2e-gate:
    name: E2E gate
    needs: detect-changes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require change detection
        if: needs.detect-changes.result != 'success'
        run: |
          echo "::error title=Change detection failed::The E2E gate cannot decide what to run, so it is failing closed."
          exit 1
      - uses: actions/checkout@v4
      - name: Verify E2E checkout configuration
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.browser == 'true'
        env:
          E2E_REF: ${{ vars.E2E_REF }}
          E2E_REPO_TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$E2E_REF" ]; then
            echo "::error title=Missing E2E_REF::Set the E2E_REF repository variable to a tag in rio-ap/web-playground-automation."
            exit 1
          fi
          case "$E2E_REF" in
            main|master|refs/heads/*)
              echo "::error title=E2E_REF is not pinned::Use a tag (for example e2e-gate-v1), not a branch."
              exit 1
              ;;
          esac
          if [ -z "$E2E_REPO_TOKEN" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::error title=E2E gate cannot run on fork PRs::The E2E repo is private, so fork PRs do not receive E2E_REPO_TOKEN."
            else
              echo "::error title=Missing E2E_REPO_TOKEN::Create a fine-grained PAT with Contents: Read-only on rio-ap/web-playground-automation."
            fi
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: needs.detect-changes.outputs.browser == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        if: needs.detect-changes.outputs.browser == 'true'
        run: npm ci
      - name: Build app
        if: needs.detect-changes.outputs.browser == 'true'
        run: npm run build
      - name: Checkout E2E suite
        if: needs.detect-changes.outputs.browser == 'true'
        uses: actions/checkout@v4
        with:
          repository: rio-ap/web-playground-automation
          ref: refs/tags/${{ vars.E2E_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: .e2e
          persist-credentials: false
      - name: Start preview
        if: needs.detect-changes.outputs.browser == 'true'
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/e2e-preview.log 2>&1 &
          echo $! > /tmp/e2e-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/e2e-preview.log
          exit 1
      - name: Run E2E gate
        id: e2e
        if: needs.detect-changes.outputs.browser == 'true'
        uses: ./.e2e/.github/actions/run-e2e
        with:
          working-directory: .e2e
          site-url: 'http://127.0.0.1:4173/'
          test-env: fe_pr
          projects: desktop,mweb
          grep: '(?=.*@critical)(?=.*(${{ needs.detect-changes.outputs.browser_tags }}))'
          label: E2E · PR gate
          result-id: e2e
          browsers: chromium
          install: 'true'
          output-dir: .ci-status/tests
      - name: Record no E2E selection
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.browser != 'true'
        run: |
          mkdir -p .ci-status/tests
          cat > .ci-status/tests/e2e.json <<JSON
          {
            "id": "e2e",
            "result": "skipped",
            "reportMissing": false,
            "total": 0,
            "passed": 0,
            "failed": 0,
            "skipped": 0,
            "failedTests": [],
            "label": "E2E · PR gate",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          {
            echo "### E2E · PR gate"
            echo
            echo "No E2E tests selected — this PR changes docs, meta, or files outside the storefront modules."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record E2E failure without a report
        if: failure()
        run: |
          if [ ! -f .ci-status/tests/e2e.json ]; then
            mkdir -p .ci-status/tests
            cat > .ci-status/tests/e2e.json <<JSON
          {
            "id": "e2e",
            "result": "failure",
            "reportMissing": true,
            "total": 0,
            "passed": 0,
            "failed": 0,
            "skipped": 0,
            "failedTests": [],
            "label": "E2E · PR gate",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
            {
              echo "### E2E · PR gate"
              echo
              echo "E2E did not produce a report; see the failing step above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/e2e-preview.pid ]; then
            kill "$(cat /tmp/e2e-preview.pid)" 2>/dev/null || true
          fi
      - name: Upload E2E report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/playwright-report/
            .e2e/test-results/
          retention-days: 7
      - name: Upload E2E status
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-status-e2e
          path: .ci-status/tests/
          retention-days: 1

  smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Production smoke test
        run: npm run test:smoke
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-status/raw/smoke.json
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report-smoke/
          retention-days: 7
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool playwright --id smoke --report .ci-status/raw/smoke.json --result "${{ job.status }}" --output .ci-status/tests/smoke.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-smoke
          path: .ci-status/tests/
          retention-days: 1

  a11y-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run accessibility audits
        run: npx playwright test -c playwright.a11y.config.ts --grep "${{ needs.detect-changes.outputs.browser_tags }}"
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-status/raw/a11y-tests.json
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report-a11y/
          retention-days: 7
      - name: Normalize test report
        if: always()
        run: node scripts/parse-test-report.mjs --tool playwright --id a11y-tests --report .ci-status/raw/a11y-tests.json --result "${{ job.status }}" --output .ci-status/tests/a11y-tests.json
      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-a11y-tests
          path: .ci-status/tests/
          retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  test-summary:
    needs: [detect-changes, products-unit, cart-unit, checkout-unit, browser-tests, e2e-gate, smoke, a11y-tests, coverage]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download test statuses
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-status-*
          merge-multiple: true
          path: .ci-status/tests
      - name: Build summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -o pipefail
          printf '%s' "$NEEDS_JSON" | node scripts/ci-summary.mjs --needs - --tests-dir .ci-status/tests --commit "${{ github.event.pull_request.head.sha }}" | tee -a "$GITHUB_STEP_SUMMARY" > ci-comment.md
      - name: Post test-status PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- ci-test-summary -->';
            const body = fs.readFileSync('ci-comment.md', 'utf8');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
