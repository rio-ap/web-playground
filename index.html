<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <meta name="description" content="Trazire Mart — a front-end test automation playground: a small demo storefront with a cart and routed checkout, built for practising UI, E2E and accessibility testing." />
  <meta property="og:title" content="Trazire Mart — demo storefront" />
  <meta property="og:description" content="A small, self-contained storefront built as a practice playground for front-end test automation — catalog, cart drawer and a routed checkout, wired for E2E, a11y and visual testing." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://playground.trazire.com/web-playground/" />
  <meta property="og:image" content="https://playground.trazire.com/web-playground/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://playground.trazire.com/web-playground/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trazire Mart</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="bg-amber-400 text-amber-900 text-center text-sm font-medium py-1.5 px-4" role="alert">
    ⚠️ Demo — No real transactions. All data stays in your browser.
  </div>
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <a href="#/" class="flex items-center gap-2 text-2xl font-bold text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l1 13H5L6 7z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 7a3 3 0 0 1 6 0" />
        </svg>
        Trazire <span class="text-blue-600">Mart</span>
      </a>
      <nav class="flex items-center gap-1">
        <a href="#/" class="px-2.5 py-1.5 text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Home</a>
        <a href="#/shop" class="px-2.5 py-1.5 text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">Shop</a>
      </nav>
      <button
        data-testid="cart-toggle-btn"
        class="relative p-2 text-gray-600 hover:text-gray-900 transition-colors cursor-pointer"
        aria-label="Open cart"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />
        </svg>
        <span
          data-testid="cart-badge"
          class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden"
        >0</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="app"></div>
  </main>

  <div data-testid="cart-modal" class="fixed inset-0 z-50 hidden" aria-modal="true" role="dialog" aria-labelledby="cart-modal-title">
    <div class="fixed inset-0 bg-black/50 transition-opacity" data-testid="cart-overlay"></div>

    <div class="fixed inset-y-0 right-0 w-full max-w-lg bg-white shadow-xl flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-gray-900" id="cart-modal-title" data-testid="cart-modal-title">Your Cart</h2>
        <button data-testid="cart-close-btn" class="text-gray-400 hover:text-gray-600 text-2xl leading-none cursor-pointer">&times;</button>
      </div>

      <div id="cart-body" class="flex-1 overflow-y-auto p-6">
        <div data-testid="cart-empty" class="text-center text-gray-500 py-12">
          <p class="text-lg">Your cart is empty</p>
        </div>

        <div id="cart-items-container" class="hidden"></div>
      </div>

      <div id="cart-footer" class="hidden border-t border-gray-200 px-6 py-4 space-y-3">
        <div class="flex justify-between items-center text-lg font-semibold">
          <span>Total:</span>
          <span data-testid="cart-total-price" class="text-blue-600">$0.00</span>
        </div>
        <button data-testid="checkout-btn" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium py-3 px-4 rounded-lg transition-colors cursor-pointer">
          Proceed to Checkout
        </button>
      </div>

    </div>
  </div>

  <div
    data-testid="toast"
    role="status"
    aria-live="polite"
    class="fixed bottom-6 left-0 right-0 z-[60] mx-auto w-fit max-w-[90vw] pointer-events-none bg-gray-900/90 text-white text-sm font-medium px-4 py-2 rounded-full shadow-lg opacity-0 text-center"
  ></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
